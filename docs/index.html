<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tausa Labs</title>
<style>
  :root { --fondo: #f6f7f5; --texto: #1d2420; --tenue: #5b665f; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #141816; --texto: #e6ebe7; --tenue: #9aa59e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 34rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  p { margin: 0; color: var(--tenue); }
  footer { margin-top: 2rem; font-size: .8rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Tausa Labs</h1>
  <p>Sitio en construcción.</p>
  <footer>versión 0.1.1</footer>
</main>
</body>
</html>
